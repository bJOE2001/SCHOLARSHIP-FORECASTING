# Nginx Reverse Proxy Configuration for DigitalOcean Droplet
# Place in /etc/nginx/sites-available/scholarship-forecasting
# Then symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name ml.yourdomain.com; # Or your Droplet's Private VPC IP

    client_max_body_size 10M;

    # Optional: Restrict access to your Laravel backend droplet's IP for security
    # allow 10.106.0.2; # Laravel Backend Droplet Private IP
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
